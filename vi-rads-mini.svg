<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">Repère visuel VI-RADS</title><desc id="desc">Schéma simplifié des séquences T2, DWI et DCE et des scores VI-RADS 1 à 5.</desc><rect width="720" height="280" rx="22" fill="#083b68"/><text x="34" y="42" fill="#dff2ff" font-family="Arial,sans-serif" font-size="22" font-weight="700">IRM VÉSICALE · VI-RADS</text><text x="34" y="68" fill="#9fc9e8" font-family="Arial,sans-serif" font-size="13">T2 · DWI/ADC · DCE — invasion du détrusor</text><g font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle"><g><rect x="34" y="94" width="115" height="42" rx="9" fill="#1d9a60"/><text x="91" y="120" fill="white">1 · très improbable</text></g><g><rect x="164" y="94" width="115" height="42" rx="9" fill="#67db26"/><text x="221" y="120" fill="#073b22">2 · improbable</text></g><g><rect x="294" y="94" width="115" height="42" rx="9" fill="#f1d900"/><text x="351" y="120" fill="#543f00">3 · équivoque</text></g><g><rect x="424" y="94" width="115" height="42" rx="9" fill="#f39800"/><text x="481" y="120" fill="#5b3000">4 · probable</text></g><g><rect x="554" y="94" width="132" height="42" rx="9" fill="#ee332b"/><text x="620" y="120" fill="white">5 · extra-vésical</text></g></g><g fill="none" stroke="#9fc9e8" stroke-width="2"><path d="M92 156v31h390v-31M222 156v31M352 156v31M482 156v31M620 156v31"/></g><g font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff"><text x="83" y="214">T2W</text><text x="237" y="214">DWI</text><text x="385" y="214">ADC</text><text x="534" y="214">DCE</text></g><g font-family="Arial,sans-serif" font-size="12" fill="#c5e2f5"><text x="34" y="250">ligne musculaire continue</text><text x="260" y="250">restriction = haut DWI / bas ADC</text><text x="545" y="250">rehaussement précoce</text></g></svg>
